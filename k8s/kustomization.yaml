apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# All k8s resources for the blog platform monorepo.
# Run: kubectl kustomize k8s/  (or: kustomize build k8s/)
resources:
  - personal-page/deployment.yaml
  - auth-service/deployment.yaml
  - post-service/deployment.yaml
  - comment-service/deployment.yaml
  - like-service/deployment.yaml
  - notification-service/deployment.yaml
  - image-service/deployment.yaml
